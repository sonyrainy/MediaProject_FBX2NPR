<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBX2NPR 얼굴 툰 필터</title>
<style>
  :root { --bg:#16161a; --panel:#1f1f25; --line:#33333c; --text:#e8e8ee; --sub:#9a9aa8; --accent:#8fb4ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Malgun Gothic", system-ui, sans-serif; }
  #wrap { display:flex; gap:16px; padding:16px; min-height:100vh; }
  #stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #gl { max-width:100%; max-height:calc(100vh - 80px); width:auto; height:auto; background:#000; border-radius:6px; }
  #status { color:var(--sub); font-size:13px; text-align:center; }
  #panel { width:300px; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow:auto; max-height:calc(100vh - 32px); }
  h1 { font-size:15px; margin:0 0 4px; }
  .desc { color:var(--sub); font-size:12px; margin:0 0 10px; }
  h2 { font-size:13px; margin:14px 0 6px; color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 46px; gap:2px 8px; align-items:center; margin:6px 0; }
  .row label { font-size:12.5px; }
  .row input[type=range] { grid-column:1 / span 2; width:100%; }
  .row .v { text-align:right; color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums; }
  .chk { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:12.5px; }
  .src a { color:var(--accent); margin-right:10px; font-size:12.5px; }
  .src a.on { color:var(--text); font-weight:bold; text-decoration:none; }
  .preset { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 2px; }
  .preset button { font:inherit; font-size:12px; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:5px; padding:4px 9px; cursor:pointer; white-space:nowrap; }
  .preset button:hover { border-color:var(--sub); }
  .preset button.on { background:var(--accent); border-color:var(--accent); color:#16161a; }
  .preset button.empty { color:var(--sub); border-style:dashed; }
  .preset .psave { margin-left:auto; }
  .lmode { display:flex; margin:2px 0 8px; }
  .lmode button { flex:1; font:inherit; font-size:12px; color:var(--text); background:transparent; border:1px solid var(--line); padding:5px 4px; cursor:pointer; white-space:nowrap; }
  .lmode button:first-child { border-radius:5px 0 0 5px; }
  .lmode button:last-child { border-radius:0 5px 5px 0; border-left:none; }
  .lmode button.on { background:var(--accent); border-color:var(--accent); color:#16161a; }
  .light { display:flex; align-items:center; gap:12px; margin:4px 0 2px; user-select:none; }
  .light canvas { width:148px; height:148px; flex:none; touch-action:none; cursor:grab; border-radius:50%; }
  .light canvas:active { cursor:grabbing; }
  .light canvas:focus { outline:none; }
  .light canvas:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .light .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .light .read { display:flex; flex-direction:column; font-size:13px; white-space:nowrap; }
  .light .read span { color:var(--sub); font-size:11px; }
  .light .read b { font-weight:normal; font-variant-numeric:tabular-nums; margin-bottom:3px; }
  .light button { font:inherit; font-size:12px; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:5px; padding:4px 6px; cursor:pointer; white-space:nowrap; }
  .light button:hover { border-color:var(--sub); }
  .light .seg { display:flex; }
  .light .seg button { flex:1; border-radius:0; padding:4px 3px; }
  .light .seg button:first-child { flex:0 0 32px; }
  .light .seg button:first-child { border-radius:5px 0 0 5px; }
  .light .seg button:last-child { border-radius:0 5px 5px 0; border-left:none; }
  .light .seg button.on { background:var(--accent); border-color:var(--accent); color:#16161a; }
  @media (max-width:800px) { #wrap { flex-direction:column; } #panel { width:100%; max-height:none; } }
</style>

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="status">불러오는 중…</div>
  </div>
  <aside id="panel">
    <h1>FBX2NPR 얼굴 툰 필터 (2단계)</h1>
    <p class="desc">실제 얼굴의 피부를 평평한 툰 색으로 바꾸고, 원형 패드로 정한 빛에 따라 FBX2NPR의 툰 그림자 띠와 외곽선을 입힙니다. 영상은 이 브라우저 안에서만 처리됩니다.</p>
    <div class="src" id="src"></div>
    <div id="controls"></div>
  </aside>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const VISION_WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const params = new URLSearchParams(location.search);
const SRC = params.get('src') || 'cam';                       // cam | front | turn
const IMAGES = { front: 'test_ch07_front.png', turn: 'test_ch07_turn.png' };
const statusEl = document.getElementById('status');
const say = (t) => { statusEl.textContent = t; };

// ---- 설정 (기본값은 Unity ToonBand 의 의미를 그대로 따름)
const S = {
  normal: 1.0,     // 0 = 추적 메시 원본 노멀, 1 = 구면 정리 노멀 (FBX2NPR 방식)
  // 빛 방향 (화면 기준): 원형 패드 안의 점 위치. x 오른쪽 · y 위, 가운데 = 정면광, 가장자리 = 측면광
  lightX: -0.444,  // 기본값은 예전 az=130 (정면에서 왼쪽으로 40° = 40/90, 수평)과 같다
  lightY: 0,
  lightBack: false,// true = 얼굴 뒤에서 비춤 (역광)
  lightAuto: true, // true = 실제 방의 빛을 얼굴 밝기로 추정해 따라간다, false = 패드로 정한 빛 (점을 끌면 수동으로 바뀐다)
  stop: 0.45,      // 명암선 위치 (_CurveStop). 0.45 면 바깥 눈꼬리에서 내려온다
  tilt: 0.6,       // 턱으로 끌어당기는 세기 (_CurveTilt)
  bend: 0.4,       // 휘는 구간 (_ChinBend)
  soft: 0.03,      // 경계 부드러움 (_CurveSoft)
  toon: 1.0,       // 얼굴 전체 툰: 0 = 실사 그대로(그림자 띠·선만 덧입힘), 1 = 피부를 평평한 툰 피부색으로
  toonKeep: 0.2,   // 원래 영상의 밝기 변화를 얼마나 남길지 (0 = 완전히 평평 — 방 조명이 전혀 안 보임)
  toonBright: 1.1, // 툰 피부색 밝기 (볼·콧등 평균 피부색의 배수)
  toonLevels: 4,   // 피부가 아닌 곳(눈·눈썹·입 안)의 밝기 단계 수
  bgToon: 0.8,     // 화면 전체(얼굴 밖) 약한 툰 세기: 0 = 실사 그대로
  bgLevels: 5,     // 화면 전체 밝기 단계 수 (많을수록 원본에 가깝다)
  bgEdge: 0.5,     // 화면 전체 경계선 진하기
  shadow: 0.85,    // 그림자 진하기
  skinColor: true, // 그림자 색: true = 피부색 기반(자연), false = 지정 색
  skinDark: 0.75,  // 피부색 기반일 때 그림자 밝기
  skinSat: 1.35,   // 피부색 기반일 때 채도 (1 = 그대로)
  skinWarm: 0.6,   // 피부색 기반일 때 붉은 기
  tint: '#bdaed6', // 지정 색 (Unity 툰의 회보라)
  depthK: 0.2,     // 구 중심 깊이 (얼굴 폭 배수)
  foreExt: 1.0,    // 이마 연장 길이 (눈썹~메시 윗변 높이 배수). 메시가 이마 중간에서 끝나 앞머리 없는 이마에서 그림자가 끊기는 것을 메운다
  thick: 1.5,      // 외곽선 두께 (px)
  dark: 0.15,      // 외곽선 진하기 (곱셈값, 낮을수록 진함)
  inner: 1.0,      // 안쪽 선(노멀 경계) 세기
  depthPx: 6,      // 깊이 경계로 볼 높이 차 (px)
  normLo: 1.2,     // 안쪽 선으로 볼 노멀 변화 기준 (높을수록 선이 적다)
  noEyeLine: false,// 눈 둘레 외곽선 끄기 (실제 속눈썹 위에 선이 겹치지 않게)
  eyeScale: 1.3,   // 선을 끄는 눈 주변 범위 (눈 윤곽 배수, 세로는 더 넓게)
  showShade: true, showLine: true, debug: false, smooth: true,
  mirror: SRC === 'cam',
};
const S_DEFAULT = { ...S };   // 코드 기본값 (프리셋의 '기본값' 버튼)

// ---- 프리셋: 패널 값 묶음을 이 브라우저(localStorage)에 저장·불러오기. 1번에는 직접 맞춘 값이 처음부터 들어 있다.
// 좌우 반전(소스마다 다름)과 명암만 보기(점검용)는 프리셋에 넣지 않는다
const PRESET_SLOTS = [1, 2, 3], PRESET_SKIP = new Set(['mirror', 'debug']);
const PRESET_BUILTIN = {
  1: { normal: 0.75, stop: 0.63, tilt: 0.6, bend: 0.4, soft: 0.03, shadow: 0.85, skinColor: true, skinDark: 0.75, skinSat: 1.35, skinWarm: 0.6, tint: '#bdaed6',
       depthK: 0.2, foreExt: 1.0, toon: 0.44, toonKeep: 0.2, toonBright: 1.1, toonLevels: 8, bgToon: 0.8, bgLevels: 5, bgEdge: 0.5,
       thick: 1.5, dark: 0.15, inner: 1.0, depthPx: 17, normLo: 1.65, noEyeLine: false, eyeScale: 1.15, showShade: true, showLine: true, smooth: true,
       lightAuto: true, lightX: -0.444, lightY: 0, lightBack: false },
};
const store = {   // 사생활 보호 모드 등에서 저장소가 막혀도 페이지는 그대로 돌아가게
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
};
let presetSel = PRESET_SLOTS.includes(+store.get('arface.preset.last')) ? +store.get('arface.preset.last') : 1;
function presetData(n) { let p = null; try { p = JSON.parse(store.get(`arface.preset.${n}`)); } catch {} return p || PRESET_BUILTIN[n] || null; }
function presetSnapshot() { const p = {}; for (const k in S) if (!PRESET_SKIP.has(k)) p[k] = S[k]; return p; }
function applyPreset(n) {   // n = 0 이면 코드 기본값
  const p = n === 0 ? S_DEFAULT : presetData(n); if (!p) return false;
  for (const k in p) if (k in S && !PRESET_SKIP.has(k)) S[k] = p[k];
  if (S.lightAuto) { const l = lightDir(); lightEst.set(l.x, l.y, l.z); lightEstT = lastTick / 1000; }   // 자동 빛은 지금 자리에서 추정값으로 부드럽게 옮겨 간다
  applyUniforms(); syncPanel(); return true;
}

// ---- 소스 링크
document.getElementById('src').innerHTML = [['cam', '웹캠'], ['front', '시험 그림(정면)'], ['turn', '시험 그림(측면)']]
  .map(([k, t]) => `<a href="?src=${k}" class="${k === SRC ? 'on' : ''}">${t}</a>`).join('');

// ---- 손떨림 보정 (One Euro 필터)
class OneEuro {
  constructor(minCutoff = 1.2, beta = 0.015, dCutoff = 1.0) { this.mc = minCutoff; this.b = beta; this.dc = dCutoff; this.x = null; this.dx = 0; this.t = null; }
  static a(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  f(x, t) {
    if (this.t === null) { this.t = t; this.x = x; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    const dx = (x - this.x) / dt, ad = OneEuro.a(this.dc, dt);
    this.dx = ad * dx + (1 - ad) * this.dx;
    const al = OneEuro.a(this.mc + this.b * Math.abs(this.dx), dt);
    this.x = al * x + (1 - al) * this.x; return this.x;
  }
}

// ---- 소스 준비
let W = 1280, H = 720, srcTex, video = null, image = null;
async function openSource() {
  if (SRC === 'cam') {
    video = document.createElement('video'); video.playsInline = true; video.muted = true;
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    } catch (e) { say('웹캠을 열지 못했습니다: ' + e.name + ' (권한을 허용했는지 확인해 주세요)'); throw e; }
    await video.play();
    W = video.videoWidth; H = video.videoHeight;
    srcTex = new THREE.VideoTexture(video);
  } else {
    image = new Image();
    // decode() 는 탭이 뒤에 있을 때 끝나지 않는 일이 있어 onload 로 기다린다
    await new Promise((res, rej) => { image.onload = res; image.onerror = () => rej(new Error('시험 그림을 불러오지 못했습니다')); image.src = IMAGES[SRC] || IMAGES.turn; });
    W = image.naturalWidth; H = image.naturalHeight;
    srcTex = new THREE.Texture(image); srcTex.needsUpdate = true;
  }
  srcTex.colorSpace = THREE.NoColorSpace;
}

// ---- 얼굴 추적기
let landmarker;
async function openLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(VISION_WASM);
  const opts = (delegate) => ({ baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: SRC === 'cam' ? 'VIDEO' : 'IMAGE', numFaces: 1 });
  try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch (e) { console.warn('GPU 추론 실패, CPU 로 전환', e); landmarker = await FaceLandmarker.createFromOptions(fileset, opts('CPU')); }
}

// ---- 추적 메시의 삼각형: 연결선(테셀레이션)에서 세 변이 모두 있는 꼭짓점 셋을 찾는다
// 이렇게 찾으면 (1) 면이 아닌 삼각 고리가 섞이고 (2) 꼭짓점 순서가 제각각이라 노멀이 엉킨다.
// 그래서 세 변이 모두 3개 이상의 삼각형에 걸린 가짜 면을 빼고, 이웃끼리 공유 변을 반대 방향으로 지나도록 감김을 맞춘다.
const triInfo = { found: 0, removed: 0, flipped: 0 };
function buildTriangles(nv) {
  const adj = Array.from({ length: nv }, () => new Set());
  for (const c of FaceLandmarker.FACE_LANDMARKS_TESSELATION) { adj[c.start].add(c.end); adj[c.end].add(c.start); }
  let tris = [];
  for (let a = 0; a < nv; a++) for (const b of adj[a]) if (b > a) for (const c of adj[b]) if (c > b && adj[a].has(c)) tris.push([a, b, c]);
  triInfo.found = tris.length;
  const key = (u, v) => u < v ? u + ',' + v : v + ',' + u;
  const count = new Map();
  for (const t of tris) for (let k = 0; k < 3; k++) { const e = key(t[k], t[(k + 1) % 3]); count.set(e, (count.get(e) || 0) + 1); }
  tris = tris.filter(t => ![0, 1, 2].every(k => count.get(key(t[k], t[(k + 1) % 3])) >= 3));
  triInfo.removed = triInfo.found - tris.length;
  const byEdge = new Map();
  tris.forEach((t, i) => { for (let k = 0; k < 3; k++) { const e = key(t[k], t[(k + 1) % 3]); if (!byEdge.has(e)) byEdge.set(e, []); byEdge.get(e).push(i); } });
  const has = (t, u, v) => (t[0] === u && t[1] === v) || (t[1] === u && t[2] === v) || (t[2] === u && t[0] === v);
  const seen = new Array(tris.length).fill(false);
  for (let s = 0; s < tris.length; s++) {
    if (seen[s]) continue; seen[s] = true; const queue = [s];
    while (queue.length) {
      const i = queue.shift(), t = tris[i];
      for (let k = 0; k < 3; k++) {
        const u = t[k], v = t[(k + 1) % 3];
        for (const j of byEdge.get(key(u, v))) {
          if (seen[j]) continue;
          if (has(tris[j], u, v)) { tris[j] = [tris[j][0], tris[j][2], tris[j][1]]; triInfo.flipped++; }   // 이웃은 u→v 가 아니라 v→u 여야 한다
          seen[j] = true; queue.push(j);
        }
      }
    }
  }
  return tris.flat();
}

// 눈 윤곽(위·아래 눈꺼풀) 연결선을 한 바퀴 고리로 잇는다 — 눈 둘레 선을 끄는 마스크용
function buildLoop(conns) {
  const adj = new Map();
  for (const c of conns) {
    if (!adj.has(c.start)) adj.set(c.start, []); if (!adj.has(c.end)) adj.set(c.end, []);
    adj.get(c.start).push(c.end); adj.get(c.end).push(c.start);
  }
  const start = conns[0].start, loop = [start]; let prev = -1, cur = start;
  for (let guard = 0; guard < 200; guard++) {
    const next = adj.get(cur).find(n => n !== prev);
    if (next === undefined || next === start) break;
    loop.push(next); prev = cur; cur = next;
  }
  return loop;
}

// ---- 셰이더
const shadeVS = `attribute float aExt; varying vec3 vPos; varying vec3 vNor; varying float vExt;
void main(){ vPos = position; vNor = normal; vExt = aExt; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

// Unity ToonBand.shader 의 얼굴 명암선 식을 그대로 옮김: 구면 노멀 + 수평 N·L + 턱 끝 기준 지수함수 임계값
const shadeFS = `varying vec3 vPos; varying vec3 vNor; varying float vExt;   // vExt: 이마 연장 띠 안에서 0(메시 윗변) → 1(연장 끝)
uniform vec3 uCenter, uUp, uNose, uLightH;   // uLightH: 빛의 수평 성분 (길이 = cos 고도)
uniform float uChinScale, uBrowH, uTopH, uStop, uTilt, uBend, uSoft, uBlend, uLightV;   // uLightV: 빛의 위아래 성분 (sin 고도)
uniform sampler2D tVideo; uniform vec2 uRes, uSkinA, uSkinB, uSkinC; uniform float uMirror, uExtOn;
vec3 Vid(vec2 uv) { return texture2D(tVideo, uMirror > 0.5 ? vec2(1.0 - uv.x, uv.y) : uv).rgb; }
float Luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
vec2 Chroma(vec3 c) { return vec2(dot(c, vec3(-0.169, -0.331, 0.5)), dot(c, vec3(0.5, -0.419, -0.081))) / max(Luma(c), 0.04); }   // 밝기로 나눈 색도
// 그 자리 영상 색이 볼·콧등에서 잰 피부색과 얼마나 비슷한가. 합성 패스의 얼굴 전체 툰과 같은 판정(색도 + 아주 어두운 털만 빼는 밝기)이라
// 머리카락 그늘로 어두워진 이마도 피부로 본다. 잔머리 한 올 한 올에 얼룩지지 않도록 주변 몇 px 를 평균해서 본다
float SkinLike() {
  vec2 uv = gl_FragCoord.xy / uRes, d = 3.0 / uRes;

  c.uShadeMode.value = S.skinColor ? 0 : 1; c.uSkinDark.value = S.skinDark; c.uSkinSat.value = S.skinSat; c.uSkinWarm.value = S.skinWarm;
  { const h = parseInt(S.tint.slice(1), 16); c.uTint.value.set((h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255); }   // 영상과 같은 sRGB 값 그대로
  c.uDepthPx.value = S.depthPx; c.uNormLo.value = S.normLo; c.uShowShade.value = S.showShade ? 1 : 0; c.uShowLine.value = S.showLine ? 1 : 0; c.uDebug.value = S.debug ? 1 : 0;
  drawLightPad();   // 패드의 미리보기 구는 명암선 위치·부드러움을 따라간다
}

// ---- 조절 패널
const SLIDERS = [
  ['빛 방향'],
  [buildLightPad],
  ['그림자 띠 (FBX2NPR 명암선 식)'],
  ['normal', '노멀: 원본(0) ↔ 구면 정리(1)', 0, 1, 0.05],
  ['stop', '명암선 위치', -0.8, 0.8, 0.01],

  ['bend', '휘는 구간', 0.05, 1.5, 0.01],
  ['soft', '경계 부드러움', 0, 0.25, 0.005],
  ['shadow', '그림자 진하기', 0, 1, 0.01],
  ['skinDark', '피부색 그림자: 밝기', 0.4, 1, 0.01],

  ['toon', '툰 세기 (0 = 실사 위에 그림자·선만)', 0, 1, 0.01],
  ['toonKeep', '원래 영상 음영 남기기 (0 = 완전히 평평)', 0, 0.6, 0.01],
  ['toonBright', '툰 피부 밝기', 0.8, 1.4, 0.01],
  ['toonLevels', '눈·눈썹·입 안 밝기 단계', 2, 8, 1],
  ['화면 전체 툰 (얼굴 밖, 약하게)'],
  ['bgToon', '세기 (0 = 실사 그대로)', 0, 1, 0.01],
  ['bgLevels', '밝기 단계', 3, 10, 1],
  ['bgEdge', '경계선 진하기', 0, 1, 0.01],
  ['외곽선 (화면공간 Sobel)'],
  ['thick', '두께 (px)', 0.5, 4, 0.1],
  ['dark', '진하기 (낮을수록 진함)', 0, 1, 0.01],
  ['inner', '안쪽 선 세기', 0, 2, 0.05],
  ['depthPx', '가려짐 경계 기준 (px)', 1, 30, 0.5],
  ['normLo', '안쪽 선 기준 (높을수록 적게)', 0.2, 3, 0.05],
  ['eyeScale', '눈 외곽선 끄는 범위', 1, 2, 0.05],
];
const CHECKS = [['noEyeLine', '눈 외곽선 끄기'], ['skinColor', '그림자 색을 피부색 기반으로 (끄면 아래 지정 색)'], ['showShade', '그림자 띠 보기'], ['showLine', '외곽선 보기'], ['debug', '명암만 보기 (흑백)'], ['smooth', '손떨림 보정 (웹캠)'], ['mirror', '좌우 반전']];
function buildPanel() {
  const root = document.getElementById('controls');
  // 프리셋: 번호 = 불러오기, '현재 값 저장' = 선택한 번호에 저장, '기본값' = 코드 기본값
  const ph = document.createElement('h2'); ph.textContent = '프리셋';
  const pr = document.createElement('div'); pr.className = 'preset';
  pr.innerHTML = PRESET_SLOTS.map(n => `<button type="button" data-n="${n}">${n}</button>`).join('') +
    `<button type="button" class="psave">현재 값 저장</button><button type="button" class="pdef">기본값</button>`;
  const pmsg = document.createElement('p'); pmsg.className = 'desc';
  root.append(ph, pr, pmsg);
  const slotBtns = [...pr.querySelectorAll('[data-n]')];
  const refresh = (msg) => {
    slotBtns.forEach(b => { const n = +b.dataset.n; b.classList.toggle('on', n === presetSel); b.classList.toggle('empty', !presetData(n)); });
    pmsg.textContent = msg || `번호를 누르면 불러오고, '현재 값 저장'은 선택한 ${presetSel}번에 저장합니다 (이 브라우저에 기억).`;
  };
  slotBtns.forEach(b => b.addEventListener('click', () => {
    const n = +b.dataset.n; presetSel = n; store.set('arface.preset.last', String(n));
    refresh(applyPreset(n) ? `${n}번 프리셋을 불러왔습니다.` : `${n}번은 비어 있습니다. 값을 맞춘 뒤 '현재 값 저장'을 누르면 ${n}번에 저장됩니다.`);
  }));
  pr.querySelector('.psave').addEventListener('click', () => refresh(store.set(`arface.preset.${presetSel}`, JSON.stringify(presetSnapshot()))
    ? `${presetSel}번에 지금 값을 저장했습니다.` : '저장하지 못했습니다 (이 브라우저에서 저장소를 쓸 수 없음).'));
  pr.querySelector('.pdef').addEventListener('click', () => { applyPreset(0); refresh('코드 기본값으로 되돌렸습니다 (저장된 프리셋은 그대로).'); });
  refresh();
  for (const s of SLIDERS) {
    if (typeof s[0] === 'function') { s[0](root); continue; }
    if (s.length === 1) { const h = document.createElement('h2'); h.textContent = s[0]; root.appendChild(h); continue; }
    const [key, label, min, max, step] = s;
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>${label}</label><span class="v"></span><input type="range" min="${min}" max="${max}" step="${step}" value="${S[key]}">`;
    const inp = row.querySelector('input'), v = row.querySelector('.v');
    const show = () => { v.textContent = (+S[key]).toFixed(step < 0.1 ? 2 : step < 1 ? 1 : 0); };
    inp.addEventListener('input', () => { S[key] = +inp.value; show(); applyUniforms(); });
    panelSync.push(() => { inp.value = S[key]; show(); });
    show(); root.appendChild(row);
  }
  const h = document.createElement('h2'); h.textContent = '표시'; root.appendChild(h);
  for (const [key, label] of CHECKS) {
    const row = document.createElement('label'); row.className = 'chk';
    row.innerHTML = `<input type="checkbox" ${S[key] ? 'checked' : ''}> ${label}`;
    const box = row.querySelector('input');
    box.addEventListener('change', (e) => { S[key] = e.target.checked; applyUniforms(); });
    panelSync.push(() => { box.checked = !!S[key]; });
    root.appendChild(row);
  }
  const colorRow = document.createElement('label'); colorRow.className = 'chk';
  colorRow.innerHTML = `<input type="color" value="${S.tint}"> 지정 그림자 색 (곱하기)`;
  const picker = colorRow.querySelector('input');
  picker.addEventListener('input', () => { S.tint = picker.value; applyUniforms(); });
  panelSync.push(() => { picker.value = S.tint; });
  root.appendChild(colorRow);
}
const panelSync = [];
function syncPanel() { for (const f of panelSync) f(); }

// ---- 빛 방향 패드: 구 위의 점을 끌거나 눌러 빛을 옮긴다. 구는 얼굴과 같은 명암선 식(턱 휨 제외)으로 칠해 미리보기가 된다
let drawLightPad = () => {}, lightStatus = () => {};
function buildLightPad(root) {
  const SIZE = 148, RAD = SIZE / 2 - 9;   // 가장자리에 놓인 점이 잘리지 않게 여백을 둔다
  const box = document.createElement('div'); box.className = 'light';
  box.innerHTML = `<canvas tabindex="0" role="slider" aria-label="빛 방향 패드 (끌기 · 방향키)"></canvas>
    <div class="info">
      <div class="read"><span>좌우</span><b></b><span>상하</span><b></b></div>
      <div class="seg"><button type="button">앞</button><button type="button">뒤 (역광)</button></div>
      <button type="button" class="reset">정면으로</button>
    </div>`;
  const mode = document.createElement('div'); mode.className = 'lmode';
  mode.innerHTML = `<button type="button">자동 · 실제 조명</button><button type="button">수동 · 패드</button>`;
  const [autoBtn, manualBtn] = mode.querySelectorAll('button');
  const hint = document.createElement('p'); hint.className = 'desc';
  root.append(mode, box, hint);
  lightStatus = () => {
    autoBtn.classList.toggle('on', S.lightAuto); manualBtn.classList.toggle('on', !S.lightAuto);
    hint.textContent = S.lightAuto
      ? `방의 실제 빛을 얼굴 밝기로 추정해 따라갑니다 (빛 방향 뚜렷함 ${Math.round(lightConf * 100)}% — 낮으면 고르게 퍼진 빛이라 정면광에 가깝게 둡니다). 점을 끌면 수동으로 바뀝니다.`
      : '점을 끌거나 눌러 빛을 옮깁니다. 가운데 = 정면광, 가장자리 = 측면광, 위아래 = 높이.';
  };
  autoBtn.addEventListener('click', () => {   // 지금 패드의 빛에서 출발해 추정값으로 부드럽게 옮겨 간다
    S.lightAuto = true; const l = lightDir(); lightEst.set(l.x, l.y, l.z); lightEstT = lastTick / 1000; drawLightPad();   // 프레임과 같은 시계로
  });
  manualBtn.addEventListener('click', () => { S.lightAuto = false; drawLightPad(); });
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
  const [hTxt, vTxt] = box.querySelectorAll('.read b');
  const [frontBtn, backBtn] = box.querySelectorAll('.seg button');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cv.height = Math.round(SIZE * dpr);
  const img = ctx.createImageData(cv.width, cv.height);
  const LIT = [233, 228, 242], DARK = [93, 86, 112];
  const deg = (r) => Math.round(r * 180 / Math.PI);

  drawLightPad = () => {
    const ld = lightDir(), c = cv.width / 2, R = RAD * dpr, d = img.data;
    const ss = (e0, e1, v) => { const k = Math.min(1, Math.max(0, (v - e0) / Math.max(e1 - e0, 1e-4))); return k * k * (3 - 2 * k); };
    for (let py = 0; py < cv.height; py++) for (let px = 0; px < cv.width; px++) {
      const nx = (px + 0.5 - c) / R, ny = (c - py - 0.5) / R, rr = nx * nx + ny * ny, o = (py * cv.width + px) * 4;
      const a = Math.min(1, Math.max(0, (1 - Math.sqrt(rr)) * R + 0.5));   // 테두리 안티에일리어싱
      if (a <= 0) { d[o + 3] = 0; continue; }
      const nz = Math.sqrt(Math.max(0, 1 - rr));
      const t = (nx * ld.x + nz * ld.z) / Math.max(Math.hypot(nx, nz), 0.35) + ny * ld.y;   // 셰이더 FaceNdotL 과 같은 식
      const lit = ss(S.stop - S.soft, S.stop + S.soft, t);
      for (let ch = 0; ch < 3; ch++) d[o + ch] = DARK[ch] + (LIT[ch] - DARK[ch]) * lit;
      d[o + 3] = a * 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.save(); ctx.scale(dpr, dpr);
    const C = SIZE / 2, hx = C + S.lightX * RAD, hy = C - S.lightY * RAD;   // 점은 패드 좌표 그대로 (빛 벡터 성분이 아니라)
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(22,22,26,0.2)';
    ctx.beginPath(); ctx.moveTo(C - RAD, C); ctx.lineTo(C + RAD, C); ctx.moveTo(C, C - RAD); ctx.lineTo(C, C + RAD); ctx.stroke();   // 십자 기준선
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.arc(C, C, RAD, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(22,22,26,0.5)'; ctx.beginPath(); ctx.moveTo(C, C); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2);
    if (S.lightBack) {   // 뒤에서 비추면 속이 빈 점선 고리
      ctx.lineWidth = 4.5; ctx.strokeStyle = '#16161a'; ctx.stroke();
      ctx.setLineDash([3, 2.5]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffc94d'; ctx.stroke();
    } else {
      ctx.fillStyle = '#ffc94d'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#16161a'; ctx.stroke();
    }
    ctx.restore();
    const h = deg(Math.atan2(ld.x, ld.z)), v = deg(Math.asin(Math.max(-1, Math.min(1, ld.y))));
    hTxt.textContent = Math.abs(v) >= 89 ? '—' : h === 0 ? '정면' : Math.abs(h) === 180 ? '바로 뒤' : `${h < 0 ? '왼쪽' : '오른쪽'} ${Math.abs(h)}°`;
    vTxt.textContent = v === 0 ? '수평' : `${v > 0 ? '위' : '아래'} ${Math.abs(v)}°`;
    frontBtn.classList.toggle('on', !S.lightBack); backBtn.classList.toggle('on', S.lightBack);
    cv.setAttribute('aria-valuetext', `좌우 ${hTxt.textContent}, 상하 ${vTxt.textContent}, ${S.lightBack ? '뒤' : '앞'}`);
    lightStatus();
  };

  const setLight = (x, y) => {   // 사용자가 패드를 만지면 수동으로 바뀐다
    const r = Math.hypot(x, y); if (r > 1) { x /= r; y /= r; }   // 원 밖으로 끌면 가장자리(측면광)에 붙인다
    S.lightAuto = false; S.lightX = x; S.lightY = y; drawLightPad();
  };
  const toFront = () => { S.lightBack = false; setLight(0, 0); };
  const fromPointer = (e) => {
    const b = cv.getBoundingClientRect(), s = b.width / SIZE;
    setLight((e.clientX - b.left - b.width / 2) / (RAD * s), -(e.clientY - b.top - b.height / 2) / (RAD * s));
  };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); fromPointer(e); });
  cv.addEventListener('pointermove', (e) => { if (cv.hasPointerCapture(e.pointerId)) fromPointer(e); });
  cv.addEventListener('keydown', (e) => {
    const st = e.shiftKey ? 0.01 : 0.05;
    const mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, st], ArrowDown: [0, -st] }[e.key];
    if (mv) setLight(S.lightX + mv[0], S.lightY + mv[1]);
    else if (e.key === 'Home') toFront();
    else return;
    e.preventDefault();
  });
  frontBtn.addEventListener('click', () => { S.lightAuto = false; S.lightBack = false; drawLightPad(); });
  backBtn.addEventListener('click', () => { S.lightAuto = false; S.lightBack = true; drawLightPad(); });
  box.querySelector('.reset').addEventListener('click', toFront);
  panelSync.push(() => drawLightPad());
}

// ---- 반복
let lms = null, lastVT = -1, lastImageDetect = -1, frames = 0, fps = 0, fpsT = performance.now();
function render() {
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(rtShade); renderer.clear();
  if (lms) { mesh.material = shadeMat; renderer.render(faceScene, cam); }
  renderer.setRenderTarget(rtNorm); renderer.clear();
  if (lms) { mesh.material = normMat; renderer.render(faceScene, cam); }
  renderer.setRenderTarget(rtEye); renderer.clear();
  if (lms) { eyeMesh.visible = S.noEyeLine; renderer.render(eyeScene, cam); }   // 입술 마스크는 툰 세기와 상관없이 (입술 한 덩어리 명암에도 쓴다)
  renderer.setRenderTarget(null); renderer.render(compScene, compCam);
}
// 성능 재기 (콘솔: __demo.bench()). 얼굴 갱신(CPU)과 렌더 4패스를 n 번 연속으로 돌린 뒤 픽셀 하나를 읽어
// GPU 가 다 끝날 때까지 기다리므로, 한 프레임에 드는 실제 시간(ms)이 나온다. 얼굴 추적(MediaPipe) 시간은 빠진다
function bench(n = 120) {
  if (!lms) return null;
  const gl = renderer.getContext(), px = new Uint8Array(4), sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  render(); sync();
  let t0 = performance.now();
  for (let i = 0; i < n; i++) updateFace(lms, t0 / 1000);
  const face = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let i = 0; i < n; i++) estimateLight(t0 / 1000, true);   // 같은 시각이라 추정값은 움직이지 않고 비용만 잰다
  const light = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let i = 0; i < n; i++) render();
  sync();
  return { face: +face.toFixed(3), light: +light.toFixed(3), render: +((performance.now() - t0) / n).toFixed(3), size: `${W}x${H}` };
}
let stepT = 0, lastTick = 0;   // __demo.step() 이 쓰는 가상 시각, 마지막 프레임 시각 (ms)
function loop(now) {
  requestAnimationFrame(loop);
  tick(now);
}
function tick(now) {   // 한 프레임 (콘솔 __demo.step() 으로도 돌릴 수 있다 — 탭이 숨겨져 rAF 가 멈췄을 때 시험용)
  lastTick = now;
  if (video && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const r = landmarker.detectForVideo(video, now);
    lms = r.faceLandmarks && r.faceLandmarks.length ? r.faceLandmarks[0] : null;
  } else if (image && lastImageDetect !== 1) {
    const r = landmarker.detect(image);
    lms = r.faceLandmarks && r.faceLandmarks.length ? r.faceLandmarks[0] : null; lastImageDetect = 1;
  }
  if (lms) { updateFace(lms, now / 1000); if (S.lightAuto) estimateLight(now / 1000); }
  render();
  frames++;
  if (now - fpsT > 1000) {
    fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
    say(`${SRC === 'cam' ? '웹캠' : '시험 그림'} ${W}×${H} · ${fps.toFixed(0)} fps · ${lms ? '얼굴 추적 중' : '얼굴을 찾지 못함'} · 메시 삼각형 ${tris.length / 3}개(가짜 면 ${triInfo.removed}개 제외, 감김 ${triInfo.flipped}개 맞춤) · 얼굴 높이 ${faceH.toFixed(0)}px`);
  }
}

(async () => {
  try {
    say('영상 여는 중…'); await openSource();
    say('얼굴 추적 모델 불러오는 중…'); await openLandmarker();
    initGL(); buildPanel(); applyUniforms();
    applyPreset(presetSel);   // 마지막으로 쓴 프리셋으로 시작 (처음이면 1번)
    window.__demo = { S, applyUniforms, triInfo, setS: (o) => { Object.assign(S, o); applyUniforms(); syncPanel(); }, bench, step: (ms = 1000 / 60) => { stepT = Math.max(stepT + ms, performance.now()); tick(stepT); },
      light: () => ({ dir: lightEst.toArray().map(v => +v.toFixed(3)), conf: +lightConf.toFixed(2), pad: [S.lightX, S.lightY].map(v => +v.toFixed(3)), back: S.lightBack }) };   // 콘솔에서 값을 바꿔 보기 위한 손잡이
    requestAnimationFrame(loop);
  } catch (e) { console.error(e); if (!statusEl.textContent.startsWith('웹캠')) say('시작하지 못했습니다: ' + (e.message || e)); }
})();
